version: "3.7"

services:
  postgres:
    image: ankane/pgvector
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: c03e2af6634b2227b45225af880089d6
      POSTGRES_DB: chatwoot
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - appnet

  redis:
    image: redis:7
    restart: always
    networks:
      - appnet

  chatwoot:
    image: chatwoot/chatwoot:v4.4.0
    depends_on:
      - postgres
      - redis
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: 65cbd55fcbf61d1d803fe93d1353e15d
      FRONTEND_URL: https://smarchat-nano.iabot.com.co
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: c03e2af6634b2227b45225af880089d6
      POSTGRES_DATABASE: chatwoot
      MAILER_SENDER_EMAIL: rbohorquez@iabot.com.co
      SMTP_DOMAIN: iabot.com.co
      SMTP_ADDRESS: smtp-relay.brevo.com
      SMTP_PORT: 587
      SMTP_USERNAME: 93bfdb001@smtp-brevo.com
      SMTP_PASSWORD: xsmtpsib-4ee154c03dd0fdb253a4bf9f68918b682e6ea5a58633b791b052444d29f2645e-Aq92XhBbcxdntDsj
      SMTP_AUTHENTICATION: login
      SMTP_ENABLE_STARTTLS_AUTO: true
      MAILER_INBOUND_EMAIL_DOMAIN: rbohorquez@iabot.com.co
      RAILS_LOG_TO_STDOUT: true
      ENABLE_ACCOUNT_SIGNUP: false
    ports:
      - "3000:3000"
    networks:
      - appnet
    volumes:
      - chatwoot_data:/app/storage

  sidekiq:
    image: chatwoot/chatwoot:v4.4.0
    depends_on:
      - postgres
      - redis
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: c03e2af6634b2227b45225af880089d6
      POSTGRES_DATABASE: chatwoot
      SECRET_KEY_BASE: 65cbd55fcbf61d1d803fe93d1353e15d
    networks:
      - appnet

  chatwoot_db_patch:
    image: postgres:15
    depends_on:
      - postgres
    restart: "no"
    entrypoint: >
      bash -c "
        echo '⏳ Esperando la base de datos...';
        sleep 10;
        echo '🚀 Aplicando configuración Enterprise...';
        psql -h postgres -U postgres -d chatwoot -c \"
          UPDATE public.installation_configs
          SET serialized_value = '--- !ruby/hash:ActiveSupport::HashWithIndifferentAccess\\nvalue: enterprise\\n'
          WHERE name = 'INSTALLATION_PRICING_PLAN';
        \";
        psql -h postgres -U postgres -d chatwoot -c \"
          UPDATE public.installation_configs
          SET serialized_value = '--- !ruby/hash:ActiveSupport::HashWithIndifferentAccess\\nvalue: 10000\\n'
          WHERE name = 'INSTALLATION_PRICING_PLAN_QUANTITY';
        \";
        psql -h postgres -U postgres -d chatwoot -c \"
          UPDATE public.installation_configs
          SET serialized_value = '--- !ruby/hash:ActiveSupport::HashWithIndifferentAccess\\nvalue: true\\n'
          WHERE name = 'INSTALLATION_ENTERPRISE_ENABLED';
        \";
      "
    environment:
      PGPASSWORD: c03e2af6634b2227b45225af880089d6
    networks:
      - appnet

networks:
  appnet:

volumes:
  pg_data:
  chatwoot_data:
